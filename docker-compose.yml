# API + Postgres. Set POSTGRES_PASSWORD in Openship (as a secret) or in your root .env for local runs.
services:
  api:
    build: ./backend
    ports:
      - "8000"
    environment:
      DATABASE_URL: postgresql://echelon:${POSTGRES_PASSWORD}@db:5432/echelon
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: echelon
      POSTGRES_DB: echelon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db-data:
